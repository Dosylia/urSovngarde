<app-connecting
  *ngIf="connecting; else form"
  [address]="name || address"
  (cancel)="cancelConnecting()"
></app-connecting>

<ng-template #form>
  <div class="container">
      <input
        [type]="hidePassword ? 'password' : 'text'"
        [placeholder]="'COMPONENT.CONNECT.PASSWORD' | transloco"
        spellcheck="false"
        [(ngModel)]="password"
        (keydown.enter)="connect()"
      >
      <span class="save-password">
        <input 
          type="checkbox"
          id="save-password"
          [(ngModel)]="savePassword"
        />
        <label for="save-password">{{ 'COMPONENT.CONNECT.SAVE_PASSWORD' | transloco }}</label>
      </span>

      <span class="hide-password">
        <input 
          type="checkbox"
          id="hide-password"
          [(ngModel)]="hidePassword"
        />
        <label for="hide-password">{{ 'COMPONENT.CONNECT.HIDE_PASSWORD' | transloco }}</label>
      </span>


      <app-action-buttons>
        <button class="menu-button compact primary" (click)="connect()">
          {{ 'COMPONENT.CONNECT.CONNECT' | transloco }}
        </button>
        <button class="menu-button compact" (click)="cancel()">
          {{ 'COMPONENT.CONNECT.CANCEL' | transloco }}
        </button>
      </app-action-buttons>
    </div>
</ng-template>
